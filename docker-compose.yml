services:
  proxy:
    build: .
    container_name: controlled-egress-proxy
    ports:
      - "127.0.0.1:8000:8000"   # web UI
      - "127.0.0.1:3128:3128"   # CONNECT proxy
    environment:
      APP_DB_PATH: /srv/data/proxy.db
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "3128"
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      DEMO_HOST: demo
      DEMO_PORT: "8080"
      DEMO_CIDR: 172.30.0.0/24
      IDLE_TIMEOUT: "120"
      CONNECT_TIMEOUT: "5"
      DNS_TIMEOUT: "3"
    volumes:
      - proxy-data:/srv/data
    depends_on:
      demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  demo:
    build: .
    container_name: controlled-egress-demo
    command: ["python", "-m", "uvicorn", "demo.demo_app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DEMO_PORT: "8080"
    networks:
      internal:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

volumes:
  proxy-data:

networks:
  internal:
    # Demo has no route to the outside: the proxy's own egress is what the
    # allow-list governs, and the demo is only a target inside the lane.
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
